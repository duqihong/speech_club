name: speech_club
description: Speech Club app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.3
  wakelock_plus: ^1.2.8
  audioplayers: ^6.0.0
