name: speech_club
description: Speech Club app
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  shared_preferences: ^2.2.3
  wakelock_plus: ^1.2.8
  audioplayers: ^6.0.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  ios: true
  android: true
  image_path: "assets/branding/app_icon_source/icon.png"
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/logo.png
    - assets/sounds/meeting_ding.mp3
    - assets/table_topics/topics.json
    - assets/content/table_topics/table_topics_bilingual.json
    - assets/content/expressions/expressions_en_source.json
    - assets/content/expressions/expressions_zh_source.json
    - assets/role_assistant/roles.json
    - assets/role_assistant/roles_en.json
    - assets/role_assistant/roles_zh.json
