flutter_icons:
  android: true
  ios: true

  # iOS: one solid square icon
  # Required by flutter_launcher_icons 0.13.x even when adaptive layers are set
  image_path_android: "assets/branding/app_icon_source/icon_foreground.png"
  image_path_ios: "assets/branding/app_icon_source/icon.png"
  remove_alpha_ios: true

  # Android: adaptive icon layers
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/app_icon_source/icon_foreground.png"

  # Increase inset => logo smaller, decrease => logo bigger
  adaptive_icon_foreground_inset: 16
